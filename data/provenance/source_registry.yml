citation_sources:
- id: google_scholar
  role: preferred_comparison
  api_url: https://serpapi.com/search?engine=google_scholar
  public_output_enabled: true
  stored_fields:
  - search_information.total_results
  - citations_per_year
  - search_metadata.processed_at
  - retrieval_service
  notes: Google Scholar has no official API. Counts are retrieved from manually verified numeric cites_id clusters, primarily through SerpApi with a capacity-checked ScraperAPI fallback. The actual retrieval service is recorded; third-party observations are excluded from the project's CC0 dedication.
- id: openalex
  role: open_graph_comparison
  api_url: https://api.openalex.org
  public_output_enabled: true
  stored_fields:
  - cited_by_count
  - counts_by_year
  - updated_date
  notes: A free API key is required. Persistent work IDs are pinned after review; routine refresh does not search.
- id: semantic_scholar
  role: optional_comparison
  api_url: https://api.semanticscholar.org/graph/v1
  public_output_enabled: true
  stored_fields:
  - citationCount
  - influentialCitationCount
  notes: The approved Public (Free/Nonprofit) API use covers the disclosed static research site. Only reviewed paper IDs and minimal timestamped citation observations are published; raw responses are not committed, S2-derived fields are excluded from the project's CC0 dedication, and public displays retain the required attribution and link-back.
- id: crossref
  role: metadata_helper
  api_url: https://api.crossref.org
  public_output_enabled: false
  notes: Used to confirm DOI and proceedings metadata, not as a citation series.
