<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">SecAwardLens social sharing card</title>
  <desc id="description">Citation impact of award-winning papers from IEEE S&amp;P, USENIX Security, ACM CCS, and NDSS.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071311"/>
      <stop offset="1" stop-color="#102a23"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 60) rotate(132) scale(540 480)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b624e" stop-opacity=".28"/>
      <stop offset="1" stop-color="#1b624e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020907" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <path d="M0 570C218 532 353 594 558 561C742 532 934 431 1200 480V630H0Z" fill="#0a1d18" opacity=".78"/>

  <g transform="translate(70 66)">
    <rect width="64" height="64" rx="15" fill="#152a24" stroke="#315348"/>
    <rect x="16" y="33" width="7" height="15" rx="3.5" fill="#69e2bc"/>
    <rect x="28.5" y="15" width="7" height="33" rx="3.5" fill="#69e2bc"/>
    <rect x="41" y="25" width="7" height="23" rx="3.5" fill="#69e2bc"/>
    <text x="82" y="43" fill="#f2f8f5" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">SecAward</text>
    <text x="227" y="43" fill="#69e2bc" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Lens</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="190" fill="#69e2bc" font-size="16" font-weight="700" letter-spacing="3">OPEN RESEARCH INFRASTRUCTURE</text>
    <text x="70" y="260" fill="#f2f8f5" font-size="46" font-weight="700">Award-winning security papers,</text>
    <text x="70" y="320" fill="#f2f8f5" font-size="46" font-weight="700">seen through</text>
    <text x="380" y="320" fill="#69e2bc" font-size="46" font-weight="700">citation impact</text>
    <text x="70" y="377" fill="#a9bcb5" font-size="21">Official awards · cross-source citations · reproducible snapshots</text>

    <g transform="translate(70 455)" font-size="16" font-weight="700">
      <circle cx="7" cy="-5" r="7" fill="#45d6ad"/>
      <text x="23" y="1" fill="#dce8e3">IEEE S&amp;P</text>
      <circle cx="145" cy="-5" r="7" fill="#ffc857"/>
      <text x="161" y="1" fill="#dce8e3">USENIX Security</text>
      <circle cx="330" cy="-5" r="7" fill="#ff7a8a"/>
      <text x="346" y="1" fill="#dce8e3">ACM CCS</text>
      <circle cx="450" cy="-5" r="7" fill="#8e92ff"/>
      <text x="466" y="1" fill="#dce8e3">NDSS</text>
    </g>
    <text x="70" y="554" fill="#8fa79e" font-size="17">qgrain.github.io/sec-award-lens</text>
  </g>

  <g transform="translate(796 112)" filter="url(#shadow)">
    <rect width="334" height="390" rx="24" fill="#10261f" stroke="#315348"/>
    <text x="30" y="43" fill="#8fa79e" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">CITATION DISTRIBUTION</text>
    <line x1="30" y1="310" x2="304" y2="310" stroke="#315348"/>
    <line x1="30" y1="244" x2="304" y2="244" stroke="#24453a" stroke-dasharray="4 7"/>
    <line x1="30" y1="178" x2="304" y2="178" stroke="#24453a" stroke-dasharray="4 7"/>
    <line x1="30" y1="112" x2="304" y2="112" stroke="#24453a" stroke-dasharray="4 7"/>

    <g stroke-width="4" stroke-linecap="round">
      <line x1="55" y1="310" x2="55" y2="142" stroke="#45d6ad"/><circle cx="55" cy="142" r="9" fill="#45d6ad"/>
      <line x1="91" y1="310" x2="91" y2="220" stroke="#ffc857"/><circle cx="91" cy="220" r="9" fill="#ffc857"/>
      <line x1="127" y1="310" x2="127" y2="96" stroke="#ff7a8a"/><circle cx="127" cy="96" r="9" fill="#ff7a8a"/>
      <line x1="163" y1="310" x2="163" y2="195" stroke="#8e92ff"/><circle cx="163" cy="195" r="9" fill="#8e92ff"/>
      <line x1="199" y1="310" x2="199" y2="164" stroke="#45d6ad"/><circle cx="199" cy="164" r="9" fill="#45d6ad"/>
      <line x1="235" y1="310" x2="235" y2="256" stroke="#ffc857"/><circle cx="235" cy="256" r="9" fill="#ffc857"/>
      <line x1="271" y1="310" x2="271" y2="126" stroke="#ff7a8a"/><circle cx="271" cy="126" r="9" fill="#ff7a8a"/>
    </g>
    <text x="30" y="354" fill="#69e2bc" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">GOOGLE SCHOLAR</text>
    <text x="207" y="354" fill="#8fa79e" font-family="Arial, Helvetica, sans-serif" font-size="13">OPENALEX · S2</text>
  </g>
</svg>
